name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 男娘测试
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 男娘测试/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run check
